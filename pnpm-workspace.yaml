shellEmulator: true

trustPolicy: no-downgrade

packages:
  - packages/*
  - apps/*

catalog:
  '@v-c/util': latest
  '@v-c/mini-decimal': latest
  '@vitejs/plugin-vue': latest
  '@vue/test-utils': latest
  jsdom: latest
  less: latest
  resize-observer-polyfill: latest
  lint-staged: latest
  simple-git-hooks: latest
  unplugin-vue: latest
  vite: latest
  vite-plugin-vue-devtools: latest
  vite-plus: latest
  vitest: latest
  vue: 3.6.0-rc.2
  vue-tsc: latest

onlyBuiltDependencies:
  - esbuild
  - less
  - simple-git-hooks
overrides:
  make-dir: ^5.1.0
  semver: ^7.0.0
